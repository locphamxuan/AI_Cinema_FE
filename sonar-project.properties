# SonarCloud / SonarQube analysis of the web app (run by .github/workflows/ci.yml).
# SonarCloud names an imported GitHub repo <organization>_<repo>; change both if yours differ.
sonar.organization=locphamxuan
sonar.projectKey=locphamxuan_AI_Cinema_FE
sonar.projectName=AI Cinema - Web

sonar.sources=src
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.{ts,tsx}
sonar.exclusions=src/tests/**,.next/**,public/**
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Type declarations carry no logic.
sonar.coverage.exclusions=src/tests/**,src/**/*.d.ts,src/types/**
